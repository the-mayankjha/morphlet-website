<path d="M652 108 C704 120 681 214 701 270 C723 332 803 285 853 358 C843 314 812 280 787 246 L705 140 Q684 112 652 108Z" fill="url(#fold)" stroke="#a0a0a4" stroke-opacity=".5" stroke-width="5"/>
<path d="M663 117 C704 143 682 229 706 275 C729 316 798 286 838 335" fill="none" stroke="#a0a0a4" stroke-width="8" opacity=".7" filter="url(#glow)"/>
</svg>
