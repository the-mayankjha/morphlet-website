<!-- Rear translucent sheet, rotated beneath the front document. -->
<g transform="rotate(-23 475 537)" filter="url(#shadow)"><rect x="189" y="181" width="548" height="661" rx="99" fill="url(#back)" stroke="url(#edge)" stroke-width="9"/><rect x="203" y="195" width="520" height="633" rx="86" fill="none" stroke="#a0a0a4" stroke-opacity=".68" stroke-width="3"/><path d="M205 280 Q310 410 723 580 V730 Q723 812 650 824 H285 Q203 824 203 742Z" fill="url(#sheen)"/></g>
<!-- Front document: translucent body, curved reflections and luminous bevel. -->
