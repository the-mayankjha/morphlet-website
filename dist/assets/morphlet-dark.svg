<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#212124" stop-opacity=".99"/><stop offset=".36" stop-color="#454548" stop-opacity=".98"/><stop offset=".68" stop-color="#18181a" stop-opacity=".96"/><stop offset="1" stop-color="#303034" stop-opacity=".99"/></linearGradient>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#545458" stop-opacity=".8"/><stop offset=".52" stop-color="#303033" stop-opacity=".43"/><stop offset="1" stop-color="#1c1c1e" stop-opacity=".83"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#909095"/><stop offset=".4" stop-color="#3f3f42" stop-opacity=".7"/><stop offset=".7" stop-color="#747478"/><stop offset="1" stop-color="#29292c"/></linearGradient>
 <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#505055"/><stop offset=".32" stop-color="#242427"/><stop offset=".6" stop-color="#77777c"/><stop offset=".85" stop-color="#36363a"/><stop offset="1" stop-color="#606066"/></linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff" stop-opacity=".14"/><stop offset=".58" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
 <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity=".18"/></filter>
 <filter id="glow" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="7"/></filter>
